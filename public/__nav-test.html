<html><body style="margin:0">
<iframe id="f" src="/" style="width:1400px;height:1100px;border:0"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const d = f.contentDocument;
    const a = [...d.querySelectorAll('a[href="/services/maintenance"]')][0];
    a.click(); // client-side navigation via next/link
    setTimeout(() => {
      const sec = [...f.contentDocument.querySelectorAll('h2')].find(h => h.textContent.includes('Build, run, improve'));
      sec && sec.scrollIntoView();
      f.contentWindow.scrollBy(0, -40);
    }, 2500);
  }, 2500);
});
</script></body></html>
